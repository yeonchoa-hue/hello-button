<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello 버튼</title>
  <style>
    body {
      font-family: "Malgun Gothic", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    button {
      padding: 12px 28px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #4a6cf7;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background: #3a5ce0;
    }
    #output {
      margin-top: 24px;
      font-size: 32px;
      font-weight: bold;
      min-height: 40px;
    }
  </style>
</head>
<body>
  <button id="helloBtn">버튼</button>
  <div id="output"></div>

  <script>
    document.getElementById("helloBtn").addEventListener("click", function () {
      document.getElementById("output").textContent = "hello";
    });
  </script>
</body>
</html>
